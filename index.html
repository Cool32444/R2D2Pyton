<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2D2 Web Assistant</title>
    
    <!-- PyScript CSS & JS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; max-width: 600px; margin: 20px auto; padding: 20px; }
        #chat-box { background: #1e293b; height: 350px; overflow-y: auto; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .user-msg { color: #60a5fa; margin: 5px 0; }
        .r2-msg { color: #4ade80; margin: 5px 0; }
        .controls { display: flex; gap: 8px; }
        input[type="text"], input[type="password"] { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #fff; }
        button { padding: 10px 15px; border: none; background: #2563eb; color: #fff; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #475569; }
    </style>
</head>
<body>

    <h2>R2D2 Assistant</h2>
    
    <div style="margin-bottom: 10px;">
        <input type="password" id="api-key-input" placeholder="Enter GEMINI_API_KEY">
    </div>

    <div id="chat-box"></div>

    <div class="controls">
        <input type="text" id="user-input" placeholder="Type a message or click Mic...">
        <button id="send-btn" py-click="handle_text_input">Send</button>
        <button id="mic-btn" onclick="toggleMic()">🎤 Start Talking</button>
    </div>

    <!-- Configure required Python packages and virtual files -->
    <py-config>
        packages = ["google-genai"]
        [[fetch]]
        files = ["./R2D2.py", "./R2Functions.py", "./Canvas.py", "./HAC.py", "./LifX.py"]
    </py-config>

    <!-- JavaScript Bridge for Browser Speech APIs -->
    <script>
        let recognition;
        let isListening = false;

        // Web Speech API for Browser-Based Voice Input
        function toggleMic() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser.");
                return;
            }

            const micBtn = document.getElementById("mic-btn");

            if (!isListening) {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = () => {
                    isListening = true;
                    micBtn.textContent = "🛑 Stop";
                    micBtn.style.background = "#dc2626";
                };

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById("user-input").value = transcript;
                    // Trigger PyScript function
                    pyscript.interpreter.globals.get('process_input')(transcript);
                };

                recognition.onend = () => {
                    isListening = false;
                    micBtn.textContent = "🎤 Start Talking";
                    micBtn.style.background = "#2563eb";
                };

                recognition.start();
            } else {
                recognition.stop();
            }
        }

        // Web Speech API for Browser-Based Voice Output (Replaces sounddevice in R2D2Speech.py)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                // Strip markdown styling for speech readouts
                const cleanText = text.replace(/\*\*/g, '').replace(/^\s*[\*\-]\s*/gm, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>

    <!-- PyScript execution block -->
    <script type="py">
        import os
        from pyscript import document, js
        import R2D2  # Loads your R2D2.py file directly

        def append_chat(sender, message):
            chat_box = document.querySelector("#chat-box")
            div = document.createElement("div")
            if sender == "You":
                div.className = "user-msg"
            else:
                div.className = "r2-msg"
            div.innerHTML = f"<strong>{sender}:</strong> {message}"
            chat_box.appendChild(div)
            chat_box.scrollTop = chat_box.scrollHeight

        def process_input(text):
            if not text.strip():
                return
            
            # Set API Key dynamically if provided in UI
            api_key = document.querySelector("#api-key-input").value
            if api_key:
                os.environ["GEMINI_API_KEY"] = api_key

            append_chat("You", text)
            document.querySelector("#user-input").value = ""

            try:
                # Call sendToGemini directly from R2D2.py
                response = R2D2.sendToGemini(text)
                append_chat("R2D2", response)
                
                # Send text response to browser Web Speech API
                js.speakText(response)
            except Exception as e:
                append_chat("System Error", str(e))

        def handle_text_input(event):
            text = document.querySelector("#user-input").value
            process_input(text)
    </script>
</body>
</html>
